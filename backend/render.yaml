services:
  - type: web
    name: truthlens-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: REALITY_DEFENDER_API_KEY
        sync: false
      - key: TRUTHLENS_MODEL
        value: prithivMLmods/deepfake-detector-model-v1
